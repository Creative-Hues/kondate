# main 以外のブランチに push されたら、テストとビルドだけを行う(公開はしない)
# 本番(main)に入れる前に、作業用のブランチで確かめるため
name: テストとビルド(作業用ブランチ)

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      # テストが失敗しても、型の間違いも一度に見られるようにビルドも動かす
      - run: npm run build
        if: ${{ !cancelled() }}
      # 画面の確認用に、ビルドしたものを別のブランチ(preview-ブランチ名)に置く(確認が終わったら消す)
      - name: ビルドしたものを確認用のブランチに置く
        run: |
          cd dist
          git init -q
          git checkout -q -b preview
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "確認用のビルド"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview:preview-${{ github.ref_name }}
